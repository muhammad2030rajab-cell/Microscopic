name: Build Android APK

# Builds android-app/ into an installable APK. Runs on every change under android-app/,
# or by hand: GitHub > Actions > "Build Android APK" > Run workflow.
on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # lets the job publish the APK to the "android-latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test launcher logic
        run: npm test

      - name: Create the Android project
        run: npx cap add android

      - name: Allow plain http to the lab hub
        run: node scripts/patch-android.mjs android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Microscopic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Microscopic-apk
          path: android-app/Microscopic.apk

      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Microscopic Android (latest)
          prerelease: true
          body: "Latest Android build. Download Microscopic.apk and install it on the phone."
          files: android-app/Microscopic.apk
