name: Unpack Rajab Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: |
          set -e

          ZIP_FILE="rajab-diagnostics-clean.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p .unpacked

          unzip -o "$ZIP_FILE" -d .unpacked

          echo "✅ ZIP extracted successfully"

      - name: Move project files to root
        run: |
          set -e

          if [ -d ".unpacked" ]; then
            find .unpacked -mindepth 1 -maxdepth 1 -exec cp -R {} . \;
            rm -rf .unpacked
          fi

          rm -f "rajab-diagnostics-clean.zip"

          echo "✅ Project files moved to repository root"

      - name: Show project structure
        run: |
          echo "📁 Project structure:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -200

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Unpack latest project version"
            git push
          fi
