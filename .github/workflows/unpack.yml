name: Unpack Rajab Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: |
          set -e

          ZIP_FILE="rajab-diagnostics-clean.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf .unpacked
          mkdir -p .unpacked

          unzip -o "$ZIP_FILE" -d .unpacked

          echo "✅ ZIP extracted successfully"

      - name: Copy project files
        run: |
          set -e

          cp -R .unpacked/. .

          echo "✅ Project files copied"

      - name: Remove ZIP
        run: |
          rm -f "rajab-diagnostics-clean.zip"
          rm -rf ".unpacked"

          echo "✅ Temporary files removed"

      - name: Remove workflows from unpacked project
        run: |
          echo "ℹ️ Keeping existing GitHub Actions workflows unchanged"

          if [ -d ".github/workflows" ]; then
            git restore .github/workflows 2>/dev/null || true
          fi

      - name: Show project structure
        run: |
          echo "📁 Project files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -200

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Add latest project version"
            git push
          fi
