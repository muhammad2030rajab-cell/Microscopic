name: Unpack Rajab Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          set -e

          if [ ! -f "rajab-diagnostics-clean.zip" ]; then
            echo "❌ rajab-diagnostics-clean.zip not found"
            exit 1
          fi

          echo "✅ ZIP found"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf .unpacked
          mkdir -p .unpacked

          unzip -o "rajab-diagnostics-clean.zip" -d .unpacked

          echo "✅ ZIP extracted"

      - name: Copy project files excluding workflows
        run: |
          set -e

          mkdir -p .tmp-project

          rsync -a \
            --exclude=".github/workflows/" \
            .unpacked/ \
            .tmp-project/

          rsync -a .tmp-project/ ./

          rm -rf .tmp-project
          rm -rf .unpacked
          rm -f "rajab-diagnostics-clean.zip"

          echo "✅ Project copied"
          echo "✅ Workflow files from ZIP were excluded"

      - name: Verify workflows
        run: |
          echo "📁 Existing workflows:"
          find .github/workflows -maxdepth 1 -type f -print 2>/dev/null || true

          echo ""
          echo "🔎 Checking extracted workflow files:"
          find . -path "*/.github/workflows/*" -type f -print 2>/dev/null || true

      - name: Commit project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          git commit -m "Add latest project version"
          git push
