<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Microscopic</title>
  <script>
    // Open the app at once in cloud mode (the default): decide before anything is drawn, so no launcher flash.
    // Coming back with the Back button, or any non-cloud mode, keeps the launcher screen.
    (function () {
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        if (nav && nav.type === "back_forward") return;
        if (/[?&]settings=1/.test(window.location.search)) return;
        var raw = localStorage.getItem("microscopic.launcher.v1");
        var s = raw ? JSON.parse(raw) : null;
        var mode = s && s.mode ? s.mode : "cloud";
        var url = s && /^https?:\/\//i.test(s.cloudUrl || "") ? s.cloudUrl : "https://microscopic.vercel.app";
        if (mode !== "cloud") return;
        document.documentElement.className = "go";
        window.location.href = url.replace(/\/+$/, "") + "/";
      } catch (e) { /* fall through to the normal launcher */ }
    })();
  </script>
  <style>
    html.go body { visibility: hidden; }
    :root { color-scheme: light; --bg:#f4f6fb; --fg:#14181f; --card:#fff; --line:#d9dde3; --accent:#2f6fed; --bad:#c62828; --ok:#1b7f3b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--fg);
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
    .brand { display:flex; flex-direction:column; align-items:center; gap:12px; }
    .brand img { width:88px; height:88px; border-radius:22px; box-shadow:0 6px 20px rgba(47,111,237,.25); }
    h1 { font-size:22px; margin:0; }
    .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    #main { background:transparent; border:0; padding:0; align-items:center; text-align:center; }
    label { font-size:14px; display:flex; flex-direction:column; gap:6px; }
    input[type=text] { font-size:16px; padding:12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:inherit; direction:ltr; text-align:left; }
    .row { display:flex; gap:8px; flex-wrap:wrap; width:100%; }
    button { font-size:16px; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:inherit; flex:1; min-width:120px; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .status { font-size:15px; min-height:22px; color:#5b6472; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    .modes label { flex-direction:row; align-items:center; gap:10px; }
    small { opacity:.7; line-height:1.5; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="icon.png" alt="" />
    <h1>Microscopic System</h1>
  </div>

  <div class="card" id="main">
    <div id="status" class="status">جاري التحميل…</div>
    <div class="row">
      <button id="open" class="primary">فتح البرنامج</button>
      <button id="toggle">الإعدادات</button>
    </div>
  </div>

  <div id="settings" class="card" hidden>
    <div class="modes">
      <label><input type="radio" name="mode" value="cloud" /> السحابة فقط</label>
      <label><input type="radio" name="mode" value="hub" /> المركز المحلي فقط</label>
      <label><input type="radio" name="mode" value="auto" /> تلقائي (السحابة، ولو مش متاحة المركز)</label>
    </div>
    <label>عنوان السحابة
      <input id="cloudUrl" type="text" inputmode="url" autocapitalize="off" autocomplete="off" />
    </label>
    <label>عنوان المركز المحلي (مثال: 192.168.1.20:8080)
      <input id="hubUrl" type="text" inputmode="url" autocapitalize="off" autocomplete="off" />
    </label>
    <div class="row">
      <button id="save" class="primary">حفظ</button>
      <button id="test">اختبار الاتصال</button>
    </div>
    <div id="testResult" class="status"></div>
    <small>تنبيه: السحابة والمركز قاعدتا بيانات منفصلتان لحد ما تتفعّل المزامنة بينهما، فالتقارير المكتوبة على واحدة مش هتظهر على التانية.</small>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
